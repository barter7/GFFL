<title>2026 Offseason Cheat Sheet</title>
<style>
:root{
  --paper:#F4F2EC; --card:#FFFFFF; --ink:#1B1E24; --ink2:#5C6068; --ink3:#8A8E96;
  --rule:#DCD8CC; --mark:#E8B923; --markwash:#FBF0C6; --add:#1F7A4D; --loss:#B23A2E;
  --addbg:#E6F1EA; --lossbg:#F8E6E3; --chip:#EFEDE5;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#14161A; --card:#1C1F25; --ink:#E8E5DD; --ink2:#A2A6AE; --ink3:#71757D;
  --rule:#2E323A; --mark:#E8B923; --markwash:#3A3212; --add:#3FA36C; --loss:#D4574A;
  --addbg:#1B2E24; --lossbg:#33201D; --chip:#262A31;
}}
:root[data-theme=light]{--paper:#F4F2EC;--card:#FFFFFF;--ink:#1B1E24;--ink2:#5C6068;--ink3:#8A8E96;
  --rule:#DCD8CC;--markwash:#FBF0C6;--add:#1F7A4D;--loss:#B23A2E;--addbg:#E6F1EA;--lossbg:#F8E6E3;--chip:#EFEDE5}
:root[data-theme=dark]{--paper:#14161A;--card:#1C1F25;--ink:#E8E5DD;--ink2:#A2A6AE;--ink3:#71757D;
  --rule:#2E323A;--markwash:#3A3212;--add:#3FA36C;--loss:#D4574A;--addbg:#1B2E24;--lossbg:#33201D;--chip:#262A31}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
header{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:4px}
h1{margin:0;font-size:20px;letter-spacing:-.01em;font-weight:800}
.sub{color:var(--ink2);font-size:12.5px;margin-top:3px;max-width:70ch}
.counts{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 0}
.count b{font-size:19px;font-weight:800;display:block;line-height:1.1}
.count span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 12px;
  border-bottom:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,button{font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:5px;padding:6px 10px}
input{min-width:210px}
button{cursor:pointer;font-size:12.5px}
button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;margin-top:14px}
.team{background:var(--card);border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.thead{display:flex;align-items:baseline;gap:9px;padding:9px 12px;border-bottom:1px solid var(--rule)}
.code{font-size:20px;font-weight:800;letter-spacing:.02em}
.churn{margin-left:auto;display:flex;gap:3px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dot.on{background:var(--mark)}
.churn small{color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-right:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:5px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
td.k{color:var(--ink3);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;width:38px;white-space:nowrap;padding-top:7px}
tr.chg td{background:var(--markwash)}
tr.chg td.k{color:var(--ink2);font-weight:700}
.was{color:var(--ink3);text-decoration:line-through;font-size:11.5px}
.arrow{color:var(--ink3);margin:0 4px}
.now{font-weight:700}
.note{color:var(--ink2);font-size:11px;font-style:italic}
.sec{padding:8px 12px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:5px}
.picks{display:flex;flex-wrap:wrap;gap:4px}
.pk{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--chip);white-space:nowrap}
.pk .r{color:var(--ink3);margin-right:3px}
.pk.skill{background:var(--markwash);font-weight:700;box-shadow:inset 0 -2px 0 var(--mark)}
.mv{font-size:11.5px;line-height:1.7}
.mv i{font-style:normal;padding:1px 5px;border-radius:3px;margin-right:4px;font-size:10px;font-weight:700}
.mv .in{background:var(--addbg);color:var(--add)}
.mv .out{background:var(--lossbg);color:var(--loss)}
.none{color:var(--ink3)}
footer{margin:22px 0 8px;color:var(--ink3);font-size:11.5px;border-top:1px solid var(--rule);padding-top:10px;max-width:80ch}
.tog{margin-left:auto}
</style>
<div class="wrap">
<header>
  <h1>2026 Offseason Cheat Sheet</h1>
  <div class="sub">What changed on all 32 teams since the end of last season — head coach, quarterback, coordinators, veteran roster moves and the 2026 draft class. Built from cached nflverse data, not from memory.</div>
  <div class="counts" id="counts"></div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search team, coach, player…" aria-label="Search">
  <button data-f="all" aria-pressed="true">All 32</button>
  <button data-f="hc" aria-pressed="false">New HC</button>
  <button data-f="qb" aria-pressed="false">New QB1</button>
  <button data-f="oc" aria-pressed="false">OC vacated</button>
  <button data-f="skill" aria-pressed="false">Early skill pick</button>
  <button class="tog" id="tog" aria-label="Toggle theme">◐</button>
</div>
<div class="grid" id="grid"></div>
<footer id="foot"></footer>
</div>
<script>
/*__DATA__*/
const $=s=>document.querySelector(s);
const byTeam={}; D.picks.forEach(p=>{(byTeam[p.team]=byTeam[p.team]||[]).push(p)});
const state={f:"all",q:""};

const nHC=D.teams.filter(t=>t.hc_change).length,
      nQB=D.teams.filter(t=>t.qb_change).length,
      nOC=D.teams.filter(t=>t.oc_vacated).length;
$("#counts").innerHTML=[[nHC,"new head coaches"],[nQB,"new starting QBs"],
  [nOC,"OCs left for HC jobs"],[D.meta.n_picks,"draft picks"],[32,"teams"]]
  .map(([n,l])=>`<div class="count"><b class="mono">${n}</b><span>${l}</span></div>`).join("");

const splitMoves=s=>s?s.split("; "):[];
function card(t){
  const pk=(byTeam[t.team]||[]), skill=pk.filter(p=>p.skill);
  const churn=[t.hc_change,t.qb_change,t.oc_vacated,skill.length>0];
  const row=(k,changed,was,now,note)=>`<tr class="${changed?"chg":""}"><td class="k">${k}</td><td>${
    changed&&was?`<span class="was">${was}</span><span class="arrow">→</span>`:""}<span class="${changed?"now":""}">${now}</span>${
    note?` <span class="note">${note}</span>`:""}</td></tr>`;
  return `<article class="team" data-team="${t.team}">
   <div class="thead"><span class="code mono">${t.team}</span>
     <span class="churn"><small>churn</small>${churn.map(c=>`<span class="dot ${c?"on":""}"></span>`).join("")}</span></div>
   <table><tbody>
     ${row("HC",t.hc_change,t.hc25,t.hc26)}
     ${row("QB",t.qb_change,`${t.qb25} (${t.qb25_starts} st)`,t.qb26||"?",
           t.qb26b?`QB2 ${t.qb26b}`:"")}
     ${row("OC",t.oc_vacated,t.oc25,t.oc_vacated?"vacant — took an HC job":(t.oc25||"?"),
           t.oc_vacated?"":(t.pc25&&t.pc25!==t.oc25?`play-caller ${t.pc25}`:""))}
     ${row("DC",false,"",t.dc_status.replace(" - needs coordinators.csv",""),"")}
   </tbody></table>
   <div class="sec"><div class="lbl">2026 draft — ${pk.length} picks${skill.length?` · ${skill.length} early skill`:""}</div>
     <div class="picks">${pk.map(p=>`<span class="pk mono ${p.skill?"skill":""}"><span class="r">R${p.round}</span>${p.name} <b>${p.pos}</b></span>`).join("")||'<span class="none">none</span>'}</div></div>
   <div class="sec"><div class="lbl">Veteran moves</div><div class="mv">
     ${splitMoves(t.adds).map(m=>`<div><i class="in">IN</i>${m}</div>`).join("")||""}
     ${splitMoves(t.losses).map(m=>`<div><i class="out">OUT</i>${m}</div>`).join("")||""}
     ${!t.adds&&!t.losses?'<span class="none">no tracked moves</span>':""}
   </div></div></article>`;
}
function render(){
  const q=state.q.toLowerCase();
  const list=D.teams.filter(t=>{
    if(state.f==="hc"&&!t.hc_change)return false;
    if(state.f==="qb"&&!t.qb_change)return false;
    if(state.f==="oc"&&!t.oc_vacated)return false;
    if(state.f==="skill"&&!(byTeam[t.team]||[]).some(p=>p.skill))return false;
    if(!q)return true;
    const hay=[t.team,t.hc25,t.hc26,t.qb25,t.qb26,t.oc25,t.pc25,t.adds,t.losses,
      (byTeam[t.team]||[]).map(p=>p.name+" "+p.pos).join(" ")].join(" ").toLowerCase();
    return hay.includes(q);
  });
  $("#grid").innerHTML=list.map(card).join("")||
    '<p class="none">No teams match that filter.</p>';
  $("#foot").innerHTML=`Showing ${list.length} of 32 · generated ${D.meta.generated}.
   <br><b>Verified from data:</b> head coaches (2026 schedule file), QB1/QB2 (latest 2026 depth-chart snapshot),
   draft picks (2026 draft release), veteran moves (2025→2026 roster diff, 150+ snap threshold in / 300+ out).
   <br><b>Caveats:</b> a roster diff can't separate a signing from a trade, so both read as "IN".
   August depth charts are camp depth charts, not Week 1 guarantees.
   <b>Coordinator names are in no nflverse dataset</b> — this sheet shows only what's derivable
   (an OC who left to become a head coach; a new HC making staff turnover near-certain); incoming
   OC/DC names come from our hand-maintained coordinators table.`;
}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
  state.f=b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render();});
$("#q").oninput=e=>{state.q=e.target.value;render()};
$("#tog").onclick=()=>{const r=document.documentElement;
  const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.dataset.theme=cur==="dark"?"light":"dark";};
render();
</script>
