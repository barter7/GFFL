# The site deploys from the repo's default branch
# (claude/espn-fantasy-dashboard-NcBRU), while work lands on main. The
# daily data refresh merges main into it once a day; a recap pushed at
# noon would otherwise not reach the site until the next morning. This
# does the same merge on every push to main.
name: Sync production branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main into the production branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout claude/espn-fantasy-dashboard-NcBRU
          git merge --no-edit origin/main
          git push origin claude/espn-fantasy-dashboard-NcBRU
